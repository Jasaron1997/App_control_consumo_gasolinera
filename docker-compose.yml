# Instancia local de SQL Server para desarrollo/pruebas — NO usar en producción
# (ahí sigue aplicando Azure SQL, ver database/04_Crear_Login_App.sql).
#
# Microsoft solo publica esta imagen para amd64; en Apple Silicon corre vía
# emulación (Rosetta/QEMU en Docker Desktop) — el arranque tarda más, pero el
# motor es el SQL Server real (soporta los índices filtrados y las columnas
# PERSISTED que usa 01_DDL_Tablas.sql, a diferencia de azure-sql-edge).
#
# Uso:
#   cp .env.example .env        # una sola vez, ajusta las contraseñas si quieres
#   docker compose up -d
#   ./database/docker-setup.sh  # crea la BD, corre 01/02/04 y siembra tu usuario
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: gasolina-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definí MSSQL_SA_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - gasolina-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  gasolina-db-data:
